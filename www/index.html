<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SAM POCKET</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/light/main.css">
  <!-- Bootstrap JS debe cargarse ANTES que Esri: el loader AMD de Esri (define.amd) rompe su registro global -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://js.arcgis.com/4.31/"></script>

  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; }
    .navbar { padding-top: calc(env(safe-area-inset-top, 0px) + .25rem); flex: 0 0 auto; }
    #view { flex: 1 1 auto; min-height: 0; }
    #info {
      position: absolute; left: 12px; bottom: 28px; z-index: 10;
      background: rgba(255,255,255,.92); padding: 6px 10px; border-radius: 8px;
      font: 12px sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    #btn-gps {
      position: absolute; right: 12px; bottom: 28px; z-index: 10;
      width: 52px; height: 52px; border-radius: 50%; border: none;
      background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); font-size: 24px;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-dark px-2">
    <span class="navbar-brand fw-bold mb-0">🛰️ SAM POCKET</span>

    <ul class="navbar-nav flex-row ms-auto gap-2">
      <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle" href="#" id="ciudadActual" role="button"
           data-bs-toggle="dropdown" aria-expanded="false">Guayaquil</a>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item active" href="#" data-ciudad="guayaquil">Guayaquil</a></li>
          <li><a class="dropdown-item" href="#" data-ciudad="quito">Quito</a></li>
          <li><a class="dropdown-item" href="#" data-ciudad="cuenca">Cuenca</a></li>
        </ul>
      </li>
    </ul>
  </nav>

  <div id="view"></div>
  <div id="info">Buscando ubicación…</div>
  <button id="btn-gps" aria-label="Ir a mi posición">📍</button>

  <script>
    // Diagnóstico: muestra errores de carga en la cajita inferior
    function mostrarError(m) {
      const i = document.getElementById("info");
      if (i) i.textContent = "⚠ " + m;
    }
    window.addEventListener("error", e => mostrarError(e.message));
    window.addEventListener("unhandledrejection", e => mostrarError((e.reason && e.reason.message) || e.reason));

    if (typeof require === "undefined") {
      mostrarError("No cargó el SDK de Esri (revisa internet)");
    }

    require([
      "esri/config", "esri/Map", "esri/views/MapView", "esri/Graphic",
      "esri/layers/GraphicsLayer", "esri/widgets/BasemapGallery", "esri/widgets/Expand"
    ], function (esriConfig, Map, MapView, Graphic, GraphicsLayer, BasemapGallery, Expand) {

      // Opcional: pega aquí tu API key de ArcGIS si algún basemap lo requiere
      // esriConfig.apiKey = "TU_API_KEY";

      const CIUDADES = {
        guayaquil: { nombre: "Guayaquil", centro: [-79.9000, -2.1700] },
        quito:     { nombre: "Quito",     centro: [-78.5249, -0.2299] },
        cuenca:    { nombre: "Cuenca",    centro: [-79.0059, -2.9001] }
      };

      const capa = new GraphicsLayer();
      const map = new Map({ basemap: "streets-navigation-vector", layers: [capa] });
      const view = new MapView({
        container: "view",
        map: map,
        center: CIUDADES.guayaquil.centro,
        zoom: 12,
        ui: { components: ["zoom"] }
      });

      // Galería de mapas base dentro de un Expand (botón desplegable)
      const galeria = new BasemapGallery({ view: view });
      view.ui.add(new Expand({
        view: view,
        content: galeria,
        expandIcon: "basemap",
        group: "top-right"
      }), "top-right");

      // Menú de ciudades (Bootstrap)
      const etiqueta = document.getElementById("ciudadActual");
      document.querySelectorAll("[data-ciudad]").forEach(function (item) {
        item.addEventListener("click", function (ev) {
          ev.preventDefault();
          const c = CIUDADES[item.dataset.ciudad];
          document.querySelectorAll("[data-ciudad]").forEach(i => i.classList.remove("active"));
          item.classList.add("active");
          etiqueta.textContent = c.nombre;
          view.goTo({ center: c.centro, zoom: 12 }, { duration: 1200 });
        });
      });

      // Posición del usuario
      const info = document.getElementById("info");
      let ultimo = null;

      function dibujar(lon, lat, precision) {
        const punto = { type: "point", longitude: lon, latitude: lat };
        capa.removeAll();
        capa.add(new Graphic({
          geometry: { type: "circle", center: punto, radius: precision, radiusUnit: "meters" },
          symbol: { type: "simple-fill", color: [0, 120, 255, 0.12],
                    outline: { color: [0, 120, 255, 0.5], width: 1 } }
        }));
        capa.add(new Graphic({
          geometry: punto,
          symbol: { type: "simple-marker", color: [0, 120, 255], size: 14,
                    outline: { color: "white", width: 2 } }
        }));
        ultimo = punto;
        info.textContent = lat.toFixed(5) + ", " + lon.toFixed(5) + "  (±" + Math.round(precision) + " m)";
      }

      if (!navigator.geolocation) {
        info.textContent = "Geolocalización no disponible";
      } else {
        navigator.geolocation.watchPosition(
          p => dibujar(p.coords.longitude, p.coords.latitude, p.coords.accuracy),
          e => { info.textContent = "Error de ubicación: " + e.message; },
          { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 }
        );
      }

      document.getElementById("btn-gps").onclick = function () {
        if (ultimo) view.goTo({ target: ultimo, zoom: 17 });
      };
    });
  </script>
</body>
</html>
